name: Compilación y pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Java ${{ matrix.java }} en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['8', '17', '21']

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compilar y ejecutar las pruebas
        run: mvn -B -ntp package

      - name: Guardar el ejecutable
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-avanzada
          path: target/*-jar-with-dependencies.jar
